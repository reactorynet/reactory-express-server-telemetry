---
global:
  scrape_interval: 15s
  evaluation_interval: 30s
  body_size_limit: 15MB
  sample_limit: 1500
  target_limit: 30
  label_limit: 30
  label_name_length_limit: 200
  label_value_length_limit: 200

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets:
          - 'localhost:9090'

  - job_name: 'reactory-express-server'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets:
          - 'host.containers.internal:9464'
        labels:
          instance: 'host'
      - targets:
          - 'reactory-express-server:9464'
        labels:
          instance: 'container'

  - job_name: 'reactory-grafana'
    static_configs:
      - targets:
          - 'reactory-grafana:3000'

  - job_name: 'reactory-jaeger'
    static_configs:
      - targets:
          - 'reactory-jaeger:14269'
